name: Atualizar bun.lock

on:
  push:
    branches: [fix/tanstack-start-seguranca]
    paths: [".github/workflows/update-lock.yml"]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Commit do bun.lock
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock já está atualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: atualiza bun.lock"
          git push
